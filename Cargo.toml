[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Rafael Faria Ferreira"]
repository = "https://github.com/RafaelFariaFerreira/fulltalk-dev"

[workspace.dependencies]
fulltalk-core = { path = "crates/fulltalk-core" }
fulltalk-asr = { path = "crates/fulltalk-asr" }
fulltalk-platform = { path = "crates/fulltalk-platform" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
ureq = "3"

# dev
tempfile = "3"
rstest = "0.28"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Plain `assert!(x.is_empty())` reads better in tests than the suggested form.
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Keep audio DSP and ONNX glue fast in dev builds too.
[profile.dev.package."*"]
opt-level = 2
